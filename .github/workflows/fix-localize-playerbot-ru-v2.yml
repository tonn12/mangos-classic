name: Fix PlayerBots localization workflow staging

on:
  push:
    branches:
      - diagnostics/travel-move-perf
    paths:
      - .github/workflows/fix-localize-playerbot-ru-v2.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: diagnostics/travel-move-perf
          fetch-depth: 0
      - name: Force-add vendored PlayerBots paths
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ChatGPT Localization Bot"
          git config user.email "actions@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/localize-playerbot-ru-v2.yml')
          text = p.read_text(encoding='utf-8')
          old = '          git add src/modules/PlayerBots/playerbot/strategy/actions/AddLootAction.cpp \\\n'
          new = '          git add -f src/modules/PlayerBots/playerbot/strategy/actions/AddLootAction.cpp \\\n'
          if old not in text:
              raise SystemExit('Expected git add line not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git rm .github/workflows/fix-localize-playerbot-ru-v2.yml
          git add .github/workflows/localize-playerbot-ru-v2.yml
          git commit -m "Fix PlayerBots localization workflow staging"
          git push origin HEAD:diagnostics/travel-move-perf
