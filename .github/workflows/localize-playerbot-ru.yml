name: Apply PlayerBots Russian localization

on:
  push:
    branches:
      - diagnostics/travel-move-perf
    paths:
      - .github/workflows/localize-playerbot-ru.yml

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout customized CMaNGOS
        uses: actions/checkout@v6
        with:
          ref: diagnostics/travel-move-perf
          fetch-depth: 0

      - name: Localize PlayerBots conversational messages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ChatGPT Localization Bot"
          git config user.email "actions@users.noreply.github.com"

          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrences, found {count}: {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          add_loot = 'src/modules/PlayerBots/playerbot/strategy/actions/AddLootAction.cpp'
          replace_exact(
              add_loot,
              '            std::ostringstream out;\n            out << hostiles.front()->GetName() << " is blocking " << wo->GetName() << ", need to kill it or I will not loot";\n            ai->TellError(requester, out.str());',
              '            std::map<std::string, std::string> args;\n            args["%unit"] = hostiles.front()->GetName();\n            args["%object"] = wo->GetName();\n            ai->TellError(requester, BOT_TEXT2("loot_blocked", args));'
          )
          replace_exact(
              add_loot,
              '                ai->TellPlayer(requester, "Can not loot quest item, my bags are full", PlayerbotSecurityLevel::PLAYERBOT_SECURITY_ALLOW_ALL, false);',
              '                ai->TellPlayer(requester, BOT_TEXT("loot_quest_bags_full"), PlayerbotSecurityLevel::PLAYERBOT_SECURITY_ALLOW_ALL, false);',
              expected=2
          )
          replace_exact(
              add_loot,
              '            ai->TellError(requester, "There is some loot but I do not have free bag space, so not looting");',
              '            ai->TellError(requester, BOT_TEXT("loot_bags_full"));',
              expected=2
          )
          replace_exact(
              add_loot,
              '            std::ostringstream out;\n            out << hostiles.front()->GetName() << " is blocking " << wo->GetName() << ", need to kill it or I will not gather";\n            ai->TellError(requester, out.str());',
              '            std::map<std::string, std::string> args;\n            args["%unit"] = hostiles.front()->GetName();\n            args["%object"] = wo->GetName();\n            ai->TellError(requester, BOT_TEXT2("gather_blocked", args));'
          )
          replace_exact(
              add_loot,
              '            std::ostringstream out;\n            out << strongHostiles.front()->GetName() << " is blocking " << wo->GetName() << ", need to kill it or I will not gather";\n            ai->TellError(requester, out.str());',
              '            std::map<std::string, std::string> args;\n            args["%unit"] = strongHostiles.front()->GetName();\n            args["%object"] = wo->GetName();\n            ai->TellError(requester, BOT_TEXT2("gather_blocked", args));'
          )

          replace_exact(
              'src/modules/PlayerBots/playerbot/strategy/actions/FollowActions.cpp',
              '            ai->TellPlayerNoFacing(requester, "I\'m heading to your location but I\'m in combat", PlayerbotSecurityLevel::PLAYERBOT_SECURITY_ALLOW_ALL, false);',
              '            ai->TellPlayerNoFacing(requester, BOT_TEXT("wait_travel_combat"), PlayerbotSecurityLevel::PLAYERBOT_SECURITY_ALLOW_ALL, false);'
          )
          replace_exact(
              'src/modules/PlayerBots/playerbot/strategy/actions/StayActions.cpp',
              '        if (verbose) ai->TellError(requester, "I can not stay, I\'m flying!");',
              '        if (verbose) ai->TellError(requester, BOT_TEXT("stay_flying"));'
          )
          replace_exact(
              'src/modules/PlayerBots/playerbot/strategy/actions/AreaTriggerAction.cpp',
              '        ai->TellError(requester, "I won\'t follow: too far away");',
              '        ai->TellError(requester, BOT_TEXT("follow_too_far"));'
          )
          replace_exact(
              'src/modules/PlayerBots/playerbot/strategy/actions/AreaTriggerAction.cpp',
              '    ai->TellError(requester, "Wait for me");',
              '    ai->TellError(requester, BOT_TEXT("wait_for_me"));'
          )
          ready = 'src/modules/PlayerBots/playerbot/strategy/actions/ReadyCheckAction.cpp'
          replace_exact(ready, '                ai->TellError(requester, "Out of ammo!");', '                ai->TellError(requester, BOT_TEXT("ready_no_ammo"));')
          replace_exact(ready, '                ai->TellError(requester, "No pet!");', '                ai->TellError(requester, BOT_TEXT("ready_no_pet"));')
          replace_exact(ready, '                ai->TellError(requester, "Pet is unhappy!");', '                ai->TellError(requester, BOT_TEXT("ready_pet_unhappy"));')

          sql = r'''-- Custom ruRU localization for PlayerBots user-facing messages.
          -- Safe to run repeatedly. Commands and strategy names remain English.
          SET NAMES utf8;

          INSERT INTO ai_playerbot_texts
            (name, text, say_type, reply_type, text_loc1, text_loc2, text_loc3, text_loc4, text_loc5, text_loc6, text_loc7, text_loc8)
          SELECT 'loot_bags_full', 'There is some loot but I do not have free bag space, so not looting', 0, 0, '', '', '', '', '', '', '', 'Есть добыча, но в сумках нет свободного места, поэтому я её не подбираю.'
          FROM DUAL WHERE NOT EXISTS (SELECT 1 FROM ai_playerbot_texts WHERE name='loot_bags_full');

          INSERT INTO ai_playerbot_texts
            (name, text, say_type, reply_type, text_loc1, text_loc2, text_loc3, text_loc4, text_loc5, text_loc6, text_loc7, text_loc8)
          SELECT 'loot_quest_bags_full', 'Can not loot quest item, my bags are full', 0, 0, '', '', '', '', '', '', '', 'Не могу подобрать квестовый предмет: в сумках нет свободного места.'
          FROM DUAL WHERE NOT EXISTS (SELECT 1 FROM ai_playerbot_texts WHERE name='loot_quest_bags_full');

          INSERT INTO ai_playerbot_texts
            (name, text, say_type, reply_type, text_loc1, text_loc2, text_loc3, text_loc4, text_loc5, text_loc6, text_loc7, text_loc8)
          SELECT 'loot_blocked', '%unit is blocking %object, need to kill it or I will not loot', 0, 0, '', '', '', '', '', '', '', '%unit мешает добраться до %object. Сначала нужно убить его, иначе я не смогу подобрать добычу.'
          FROM DUAL WHERE NOT EXISTS (SELECT 1 FROM ai_playerbot_texts WHERE name='loot_blocked');

          INSERT INTO ai_playerbot_texts
            (name, text, say_type, reply_type, text_loc1, text_loc2, text_loc3, text_loc4, text_loc5, text_loc6, text_loc7, text_loc8)
          SELECT 'gather_blocked', '%unit is blocking %object, need to kill it or I will not gather', 0, 0, '', '', '', '', '', '', '', '%unit мешает добраться до %object. Сначала нужно убить его, иначе я не смогу собрать ресурс.'
          FROM DUAL WHERE NOT EXISTS (SELECT 1 FROM ai_playerbot_texts WHERE name='gather_blocked');

          INSERT INTO ai_playerbot_texts
            (name, text, say_type, reply_type, text_loc1, text_loc2, text_loc3, text_loc4, text_loc5, text_loc6, text_loc7, text_loc8)
          SELECT 'wait_travel_combat', 'I''m heading to your location but I''m in combat', 0, 0, '', '', '', '', '', '', '', 'Я иду к тебе, но сейчас нахожусь в бою.'
          FROM DUAL WHERE NOT EXISTS (SELECT 1 FROM ai_playerbot_texts WHERE name='wait_travel_combat');

          INSERT INTO ai_playerbot_texts
            (name, text, say_type, reply_type, text_loc1, text_loc2, text_loc3, text_loc4, text_loc5, text_loc6, text_loc7, text_loc8)
          SELECT 'stay_flying', 'I can not stay, I''m flying!', 0, 0, '', '', '', '', '', '', '', 'Я не могу остановиться — я в полёте!'
          FROM DUAL WHERE NOT EXISTS (SELECT 1 FROM ai_playerbot_texts WHERE name='stay_flying');

          INSERT INTO ai_playerbot_texts
            (name, text, say_type, reply_type, text_loc1, text_loc2, text_loc3, text_loc4, text_loc5, text_loc6, text_loc7, text_loc8)
          SELECT 'follow_too_far', 'I won''t follow: too far away', 0, 0, '', '', '', '', '', '', '', 'Я не могу следовать за тобой: слишком далеко.'
          FROM DUAL WHERE NOT EXISTS (SELECT 1 FROM ai_playerbot_texts WHERE name='follow_too_far');

          INSERT INTO ai_playerbot_texts
            (name, text, say_type, reply_type, text_loc1, text_loc2, text_loc3, text_loc4, text_loc5, text_loc6, text_loc7, text_loc8)
          SELECT 'wait_for_me', 'Wait for me', 0, 0, '', '', '', '', '', '', '', 'Подожди меня!'
          FROM DUAL WHERE NOT EXISTS (SELECT 1 FROM ai_playerbot_texts WHERE name='wait_for_me');

          INSERT INTO ai_playerbot_texts
            (name, text, say_type, reply_type, text_loc1, text_loc2, text_loc3, text_loc4, text_loc5, text_loc6, text_loc7, text_loc8)
          SELECT 'ready_no_ammo', 'Out of ammo!', 0, 0, '', '', '', '', '', '', '', 'У меня закончились боеприпасы!'
          FROM DUAL WHERE NOT EXISTS (SELECT 1 FROM ai_playerbot_texts WHERE name='ready_no_ammo');

          INSERT INTO ai_playerbot_texts
            (name, text, say_type, reply_type, text_loc1, text_loc2, text_loc3, text_loc4, text_loc5, text_loc6, text_loc7, text_loc8)
          SELECT 'ready_no_pet', 'No pet!', 0, 0, '', '', '', '', '', '', '', 'У меня нет питомца!'
          FROM DUAL WHERE NOT EXISTS (SELECT 1 FROM ai_playerbot_texts WHERE name='ready_no_pet');

          INSERT INTO ai_playerbot_texts
            (name, text, say_type, reply_type, text_loc1, text_loc2, text_loc3, text_loc4, text_loc5, text_loc6, text_loc7, text_loc8)
          SELECT 'ready_pet_unhappy', 'Pet is unhappy!', 0, 0, '', '', '', '', '', '', '', 'Мой питомец недоволен!'
          FROM DUAL WHERE NOT EXISTS (SELECT 1 FROM ai_playerbot_texts WHERE name='ready_pet_unhappy');

          UPDATE ai_playerbot_texts SET text_loc8='Я принял задание %quest.' WHERE name='quest_accepted';
          UPDATE ai_playerbot_texts SET text_loc8='Не могу принять %quest: в сумках нет свободного места.' WHERE name='quest_error_bag_full';
          UPDATE ai_playerbot_texts SET text_loc8='%quest ещё не выполнено.' WHERE name='quest_status_incomplete';
          UPDATE ai_playerbot_texts SET text_loc8='%quest доступно для принятия.' WHERE name='quest_status_available';
          UPDATE ai_playerbot_texts SET text_loc8='%quest провалено.' WHERE name='quest_status_failed';
          UPDATE ai_playerbot_texts SET text_loc8='Я не могу выполнить %quest.' WHERE name='quest_status_unable_to_complete';
          UPDATE ai_playerbot_texts SET text_loc8='%quest выполнено.' WHERE name='quest_status_completed';
          UPDATE ai_playerbot_texts SET text_loc8='Я уже выполнил %quest.' WHERE name='quest_error_completed';
          UPDATE ai_playerbot_texts SET text_loc8='У меня уже есть %quest.' WHERE name='quest_error_have_quest';
          UPDATE ai_playerbot_texts SET text_loc8='Я не могу принять %quest из-за требований задания.' WHERE name='quest_error_cant_take';
          UPDATE ai_playerbot_texts SET text_loc8='Не могу принять %quest: журнал заданий заполнен.' WHERE name='quest_error_log_full';
          '''

          sql_path = Path('src/modules/PlayerBots/sql/world/ai_playerbot_texts_ruRU_custom.sql')
          sql_path.write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in sql.splitlines()) + '\n', encoding='utf-8')
          PY

          git rm .github/workflows/localize-playerbot-ru.yml
          git add src/modules/PlayerBots/playerbot/strategy/actions/AddLootAction.cpp
          git add src/modules/PlayerBots/playerbot/strategy/actions/FollowActions.cpp
          git add src/modules/PlayerBots/playerbot/strategy/actions/StayActions.cpp
          git add src/modules/PlayerBots/playerbot/strategy/actions/AreaTriggerAction.cpp
          git add src/modules/PlayerBots/playerbot/strategy/actions/ReadyCheckAction.cpp
          git add -f src/modules/PlayerBots/sql/world/ai_playerbot_texts_ruRU_custom.sql
          git diff --cached --check
          git commit -m "Localize PlayerBots conversational messages to ruRU"
          git push origin HEAD:diagnostics/travel-move-perf
