name: Cleanup experimental quest loot changes

on:
  push:
    branches:
      - diagnostics/travel-move-perf
    paths:
      - .github/workflows/cleanup-quest-loot-and-quests.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout customized CMaNGOS
        uses: actions/checkout@v6
        with:
          ref: diagnostics/travel-move-perf
          fetch-depth: 0

      - name: Restore upstream loot behavior and quests default
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ChatGPT Cleanup Bot"
          git config user.email "actions@users.noreply.github.com"

          curl -fsSL "https://raw.githubusercontent.com/tonn12/playerbots/046d70e0f36f48bbfe055abc6063ed061801ff62/playerbot/strategy/actions/LootAction.cpp" \
            -o src/modules/PlayerBots/playerbot/strategy/actions/LootAction.cpp

          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/modules/PlayerBots/playerbot/strategy/actions/ListQuestsActions.cpp')
          text = path.read_text(encoding='utf-8')

          old = '''    if (text == "all")
        state = ALL;
    else if (text == "co" || text == "completed")
        state = COMPLETED;
    else if (text == "in" || text == "incompleted")
        state = INCOMPLETE;
    else
        state = SUMMARY;'''

          new = '''    // Preserve the old chat-command behavior: plain `quests` prints the full list.
    // The compact count-only view remains available explicitly as `quests summary`.
    if (text.empty() || text == "all")
        state = ALL;
    else if (text == "summary")
        state = SUMMARY;
    else if (text == "co" || text == "completed")
        state = COMPLETED;
    else if (text == "in" || text == "incompleted")
        state = INCOMPLETE;
    else
        state = SUMMARY;'''

          if old not in text:
              raise SystemExit('Expected quests state parser not found; refusing to modify')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          git rm .github/workflows/cleanup-quest-loot-and-quests.yml
          git add -f src/modules/PlayerBots/playerbot/strategy/actions/LootAction.cpp
          git add -f src/modules/PlayerBots/playerbot/strategy/actions/ListQuestsActions.cpp
          git diff --cached --check
          git commit -m "Restore PlayerBots loot behavior and full quests output"
          git push origin HEAD:diagnostics/travel-move-perf
