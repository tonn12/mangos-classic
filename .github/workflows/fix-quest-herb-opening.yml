name: Apply quest herb opening fix

on:
  push:
    branches:
      - diagnostics/travel-move-perf
    paths:
      - .github/workflows/fix-quest-herb-opening.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-2022
    steps:
      - name: Checkout customized CMaNGOS
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Replace direct GameObject use with opening spell
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "ChatGPT Fix Bot"
          git config user.email "actions@users.noreply.github.com"

          @'
          from pathlib import Path

          path = Path("src/modules/PlayerBots/playerbot/strategy/actions/LootAction.cpp")
          data = path.read_text(encoding="utf-8")
          old = '''        if (isForQuest)\n        {\n            // Quest herb-like objects should be usable without the Herbalism profession.\n            if (go)\n            {\n                go->Use(bot);\n                SetDuration(sPlayerbotAIConfig.lootDelay);\n                return true;\n            }\n\n            return false;\n        }'''
          new = '''        if (isForQuest)\n        {\n            // Quest herb-like objects use the normal opening spell even when\n            // the bot does not know Herbalism. The loot target is already the GO,\n            // so PlayerbotAI::CastSpell will target the GameObject.\n            return ai->CastSpell(sPlayerbotAIConfig.openGoSpell, bot);\n        }'''
          if old not in data:
              raise SystemExit("Expected quest herb direct-use block was not found")
          path.write_text(data.replace(old, new, 1), encoding="utf-8", newline="")
          '@ | python -

          git add src/modules/PlayerBots/playerbot/strategy/actions/LootAction.cpp
          git commit -m "Fix quest herb GameObject opening"
          git push origin HEAD:diagnostics/travel-move-perf
