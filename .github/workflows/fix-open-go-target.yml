name: Apply direct GameObject opening fix

on:
  push:
    branches:
      - diagnostics/travel-move-perf
    paths:
      - .github/workflows/fix-open-go-target.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout customized CMaNGOS
        uses: actions/checkout@v6
        with:
          ref: diagnostics/travel-move-perf
          fetch-depth: 0

      - name: Patch PlayerBots GameObject opening target
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/modules/PlayerBots/playerbot/strategy/actions/LootAction.cpp')
          text = path.read_text(encoding='utf-8')

          old = '''    return ai->CastSpell(spellId, bot);\n}\n\nuint32 OpenLootAction::GetOpeningSpell'''
          new = '''    // Opening spells for GameObjects must target the GameObject directly.\n    // Passing the bot as a Unit target can make generic Opening (6477)\n    // complete without actually opening the selected chest.\n    if (go)\n        return ai->CastSpell(spellId, go);\n\n    return ai->CastSpell(spellId, bot);\n}\n\nuint32 OpenLootAction::GetOpeningSpell'''

          if old not in text:
              raise SystemExit('Expected OpenLootAction tail was not found; refusing to patch')

          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit fix and remove one-time workflow
        shell: bash
        run: |
          git config user.name "ChatGPT Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/fix-open-go-target.yml
          git add src/modules/PlayerBots/playerbot/strategy/actions/LootAction.cpp
          git commit -m "Fix GameObject opening spell target"
          git push origin HEAD:diagnostics/travel-move-perf
