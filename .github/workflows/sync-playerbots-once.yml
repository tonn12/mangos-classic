name: Sync PlayerBots From Fork Once

on:
  push:
    branches:
      - sync/playerbots-upstream-2026-09
    paths:
      - .github/workflows/sync-playerbots-once.yml

permissions:
  contents: write

jobs:
  sync-playerbots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mangos-classic sync branch
        uses: actions/checkout@v4
        with:
          ref: sync/playerbots-upstream-2026-09
          fetch-depth: 0

      - name: Checkout updated PlayerBots fork
        uses: actions/checkout@v4
        with:
          repository: tonn12/playerbots
          ref: diagnostics/travel-move-perf
          path: _playerbots
          fetch-depth: 1

      - name: Replace embedded PlayerBots with updated fork
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf src/modules/PlayerBots
          mkdir -p src/modules/PlayerBots
          rsync -a --exclude='.git' _playerbots/ src/modules/PlayerBots/
          rm -rf _playerbots

      - name: Commit synchronized PlayerBots
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/PlayerBots
          if git diff --cached --quiet; then
            echo "PlayerBots already synchronized"
          else
            git commit -m "Sync PlayerBots with upstream while preserving custom changes"
          fi
          git push origin HEAD:sync/playerbots-upstream-2026-09
