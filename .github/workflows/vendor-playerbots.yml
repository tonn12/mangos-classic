name: Vendor PlayerBots into mangos-classic

on:
  push:
    branches:
      - diagnostics/travel-move-perf
    paths:
      - .github/workflows/vendor-playerbots.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: windows-2022

    steps:
      - name: Checkout customized CMaNGOS
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Vendor customized PlayerBots and fold build-time patches into source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          git config user.name "ChatGPT Migration Bot"
          git config user.email "actions@users.noreply.github.com"

          if (Test-Path "src/modules/PlayerBots/CMakeLists.txt") {
            Write-Host "PlayerBots is already vendored; nothing to do."
            exit 0
          }

          git remote add playerbots https://github.com/tonn12/playerbots.git
          git fetch playerbots diagnostics/travel-move-perf

          New-Item -ItemType Directory -Force -Path "src/modules" | Out-Null
          git read-tree --prefix=src/modules/PlayerBots/ -u playerbots/diagnostics/travel-move-perf

          # Preserve the current custom build behavior by permanently applying
          # the same PlayerBots profiling/TravelNode changes that used to be
          # applied only inside GitHub Actions.
          git apply --directory=src/modules/PlayerBots --recount .github/patches/playerbots-deep-movement-perf.patch
          .github/scripts/apply-playerbots-travelnode-perf.ps1 -Path "src/modules/PlayerBots/playerbot/TravelNode.cpp"
          .github/scripts/apply-playerbots-travelnode-opt.ps1 -Path "src/modules/PlayerBots/playerbot/TravelNode.cpp"

          # Fix quest herb-like GameObjects: quest objects must be directly
          # usable even when the bot does not know Herbalism.
          @'
          from pathlib import Path

          path = Path("src/modules/PlayerBots/playerbot/strategy/actions/LootAction.cpp")
          data = path.read_text(encoding="utf-8")
          old = '''        if (!isForQuest)\n        {\n            return ai->HasSkill(SKILL_HERBALISM) ? ai->CastSpell(HERB_GATHERING, bot) : false;\n        }'''
          new = '''        if (isForQuest)\n        {\n            // Quest herb-like objects should be usable without the Herbalism profession.\n            if (go)\n            {\n                go->Use(bot);\n                SetDuration(sPlayerbotAIConfig.lootDelay);\n                return true;\n            }\n\n            return false;\n        }\n\n        return ai->HasSkill(SKILL_HERBALISM) ? ai->CastSpell(HERB_GATHERING, bot) : false;'''
          if old not in data:
              raise SystemExit("Expected quest herb block was not found in LootAction.cpp")
          path.write_text(data.replace(old, new, 1), encoding="utf-8", newline="")
          '@ | python -

          # PlayerBots now lives in this repository, so stop fetching it from
          # a separate GitHub repository during CMake configure.
          @'
          from pathlib import Path

          path = Path("src/CMakeLists.txt")
          data = path.read_text(encoding="utf-8")
          start = data.index("# Playerbots module")
          end = data.index("if(BUILD_GAME_SERVER)", start)
          replacement = '''# Playerbots module\nif(BUILD_PLAYERBOTS)\n  add_subdirectory(modules/PlayerBots)\nendif()\n\n'''
          path.write_text(data[:start] + replacement + data[end:], encoding="utf-8", newline="")
          '@ | python -

          # The PlayerBots performance changes are now committed source, so
          # remove the old build-time patching steps from the Windows workflow.
          @'
          from pathlib import Path

          path = Path(".github/workflows/custom-windows.yml")
          lines = path.read_text(encoding="utf-8").splitlines()
          remove_names = {
              "Apply deep PlayerBots movement profiler",
              "Apply TravelNode deep profiler",
              "Apply TravelNode performance optimizations",
              "Show PlayerBots revision",
          }
          out = []
          i = 0
          while i < len(lines):
              line = lines[i]
              stripped = line.strip()
              if stripped.startswith("- name:"):
                  name = stripped.split(":", 1)[1].strip()
                  if name in remove_names:
                      i += 1
                      while i < len(lines):
                          nxt = lines[i]
                          if nxt.startswith("      - name:"):
                              break
                          i += 1
                      continue
              out.append(line)
              i += 1

          marker = "      - name: Package"
          insert = [
              "      - name: Show vendored PlayerBots changes",
              "        shell: pwsh",
              "        run: |",
              "          git log -1 --oneline -- src/modules/PlayerBots",
              "          git status --short",
              "",
          ]
          idx = out.index(marker)
          out[idx:idx] = insert
          path.write_text("\n".join(out) + "\n", encoding="utf-8", newline="")
          '@ | python -

          @'
          # Vendored PlayerBots

          Source repository: `tonn12/playerbots`
          Source branch at migration: `diagnostics/travel-move-perf`
          Source commit: `edf099e76b06d9d4a8ada909a201886156df0ad8`

          This copy also contains the CMaNGOS custom movement/TravelNode patches
          that were previously applied only during GitHub Actions builds, plus
          the quest herb-like GameObject interaction fix.
          '@ | Set-Content -Encoding UTF8 "src/modules/PlayerBots/VENDORED_FROM.md"

          # One-time migration workflow: remove it from the resulting branch.
          git rm .github/workflows/vendor-playerbots.yml

          git add -A
          git status --short
          git commit -m "Vendor customized PlayerBots into mangos-classic"
          git push origin HEAD:diagnostics/travel-move-perf
