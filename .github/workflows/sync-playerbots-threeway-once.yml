name: Three-Way Sync PlayerBots Once

on:
  push:
    branches:
      - sync/playerbots-upstream-2026-09-v2
    paths:
      - .github/workflows/sync-playerbots-threeway-once.yml

permissions:
  contents: write

jobs:
  sync-playerbots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mangos-classic sync branch
        uses: actions/checkout@v4
        with:
          ref: sync/playerbots-upstream-2026-09-v2
          fetch-depth: 0

      - name: Three-way merge embedded custom PlayerBots with updated fork
        shell: bash
        run: |
          set -euxo pipefail

          # Preserve the PlayerBots tree currently embedded in mangos-classic.
          cp -a src/modules/PlayerBots _embedded_playerbots

          # Reconstruct real PlayerBots history from the commit our embedded copy was based on.
          git clone https://github.com/tonn12/playerbots.git _merge_playerbots
          cd _merge_playerbots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b embedded-custom edf099e76b06d9d4a8ada909a201886156df0ad8

          # Reapply every mangos-classic-only PlayerBots modification as one commit.
          rsync -a --delete --exclude='.git' ../_embedded_playerbots/ ./
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Reapply embedded mangos-classic PlayerBots customizations"
          fi

          # Merge the now-updated fork. Non-conflicting upstream changes are kept;
          # conflicting hunks prefer our embedded customizations so performance patches
          # are not overwritten.
          git merge --no-edit -X ours origin/diagnostics/travel-move-perf

          cd ..
          rm -rf src/modules/PlayerBots
          mkdir -p src/modules/PlayerBots
          rsync -a --exclude='.git' _merge_playerbots/ src/modules/PlayerBots/
          rm -rf _embedded_playerbots _merge_playerbots

      - name: Commit merged PlayerBots into mangos-classic
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f src/modules/PlayerBots
          if git diff --cached --quiet; then
            echo "PlayerBots already synchronized"
          else
            git commit -m "Merge upstream PlayerBots while preserving custom changes"
          fi
          git push origin HEAD:sync/playerbots-upstream-2026-09-v2
